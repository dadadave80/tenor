[profile.default]
solc = "0.8.36"
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 1_000_000
# Hedera consensus node v0.76 runs Cancun (evm.version v0.67). Pinning also keeps
# HashScan / Sourcify verification reproducible. Matches Lattice's [profile.hedera].
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "deployments" }, { access = "read", path = "out" }]
# ATS ships as an npm package installed at the REPO root (the web app and scripts need the same
# version), so its sources sit one level above this Foundry root. solc refuses imports outside the
# project unless the path is explicitly allowed.
allow_paths = ["../node_modules"]

[profile.ci]
build_info = true
extra_output = ["storageLayout"]

[fmt]
line_length = 120
tab_width = 4

[rpc_endpoints]
hedera-testnet = "${HEDERA_TESTNET_RPC}"
